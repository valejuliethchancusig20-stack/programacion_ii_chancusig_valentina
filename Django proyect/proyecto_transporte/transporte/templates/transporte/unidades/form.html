{% extends "transporte/base.html" %}
{% block title %}Formulario de Unidad - Transporte Público{% endblock %}
{% block content %}
<h1>{% if form.instance.pk %}Editar Unidad{% else %}Nueva Unidad{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a href="{% url 'unidad_lista' %}">Cancelar</a>
</form>
{% endblock %}
