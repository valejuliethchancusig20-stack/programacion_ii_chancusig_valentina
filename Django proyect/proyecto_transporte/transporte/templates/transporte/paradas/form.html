{% extends "transporte/base.html" %}
{% block title %}Formulario de Parada - Transporte Público{% endblock %}
{% block content %}
<h1>{% if form.instance.pk %}Editar Parada{% else %}Nueva Parada{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a href="{% url 'parada_lista' %}">Cancelar</a>
</form>
{% endblock %}
